function field(obj, key) {
  if (!obj) return '';
  if (currentLang === 'en' && obj[key + '_en']) return obj[key + '_en'];
  return obj[key] || '';
}

// ===== 导航生成 =====
const NAV_SECTIONS = [
  { id: 'profile', icon: '👤', zh: '个人信息', en: 'Profile' },
  { id: 'education', icon: '🎓', zh: '教育经历', en: 'Education' },
  { id: 'experience', icon: '💼', zh: '工作经历', en: 'Experience' },
  { id: 'projects', icon: '🚀', zh: '项目作品', en: 'Projects' },
  { id: 'skills', icon: '🛠', zh: '技能标签', en: 'Skills' },
  { id: 'research', icon: '🔬', zh: '科研经历', en: 'Research' },
  { id: 'publications', icon: '📄', zh: '论文发表', en: 'Publications' },
  { id: 'awards', icon: '🏆', zh: '获奖荣誉', en: 'Awards' },
];

function renderNav() {
  document.getElementById('navList').innerHTML = NAV_SECTIONS.map(s =>
    `<li><button class="nav-item" data-target="${s.id}" onclick="scrollToSection('${s.id}')">
      <span class="nav-icon">${s.icon}</span>${t(s.zh, s.en)}
    </button></li>`
  ).join('');
}

function scrollToSection(id) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
  updateActiveNav(id);
}

function updateActiveNav(id) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-target="${id}"]`)?.classList.add('active');
}

function renderSection(id, icon, zh, en, items, cardFn, modalFn) {
  if (!items || items.length === 0) return '';
  return `
    <div class="section" id="${id}">
      <div class="section-title">${icon} ${t(zh, en)}</div>
      <div class="card-list">
        ${items.map(item => `
          <div class="card" onclick="openModal('${id}', '${item.id}')">
            ${cardFn(item)}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderSkills() {
  const skills = resumeData.skills;
  if (!skills || skills.length === 0) return '';
  return `
    <div class="section" id="skills">
      <div class="section-title">🛠 ${t('技能标签', 'Skills')}</div>
      ${skills.map(g => `
        <div class="skill-group">
          <div class="skill-category">${field(g, 'category')}</div>
          <div class="skill-tags">
            ${g.items.map(s => `<span class="skill-tag">${s}</span>`).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

// ===== 弹窗 =====
function openModal(sectionId, itemId) {
  const sectionMap = {
    education: resumeData.education,
    experience: resumeData.experience,
    projects: resumeData.projects,
    research: resumeData.research,
    publications: resumeData.publications,
    awards: resumeData.awards,
  };
  const items = sectionMap[sectionId];
  if (!items) return;
  const item = items.find(i => i.id === itemId);
  if (!item) return;

  let bodyHTML = '';
  if (sectionId === 'education') {
    bodyHTML = `
      <div class="modal-title">${field(item, 'school')}</div>
      <div class="modal-sub">${field(item, 'degree')}</div>
      <div class="modal-meta"><span>📅 ${item.start} — ${field(item, 'end')}</span>${item.gpa ? `<span>📊 GPA: ${item.gpa}</span>` : ''}</div>
      ${item.details ? `<div class="modal-section"><h4>${t('详细描述', 'Details')}</h4><ul class="modal-detail-list">${(currentLang==='en'&&item.details_en?item.details_en:item.details).map(d=>`<li>${d}</li>`).join('')}</ul></div>` : ''}
      ${editMode ? editButtons(sectionId, item) : ''}
    `;
  } else if (sectionId === 'experience') {
    bodyHTML = `
      <div class="modal-title">${field(item, 'position')}</div>
      <div class="modal-sub">${field(item, 'company')}</div>
      <div class="modal-meta"><span>📅 ${item.start} — ${field(item, 'end')}</span></div>
      ${item.details ? `<div class="modal-section"><h4>${t('工作职责', 'Responsibilities')}</h4><ul class="modal-detail-list">${(currentLang==='en'&&item.details_en?item.details_en:item.details).map(d=>`<li>${d}</li>`).join('')}</ul></div>` : ''}
      ${editMode ? editButtons(sectionId, item) : ''}
    `;
  } else if (sectionId === 'projects') {
    bodyHTML = `
      <div class="modal-title">${field(item, 'name')}</div>
      ${item.link ? `<div class="modal-sub"><a href="${item.link}" target="_blank" style="color:var(--blue-600)">${item.link}</a></div>` : ''}
      ${item.tech ? `<div class="modal-section"><h4>${t('技术栈', 'Tech Stack')}</h4><div class="modal-badges">${item.tech.map(t=>`<span class="skill-tag">${t}</span>`).join('')}</div></div>` : ''}
      ${item.details ? `<div class="modal-section"><h4>${t('项目亮点', 'Highlights')}</h4><ul class="modal-detail-list">${(currentLang==='en'&&item.details_en?item.details_en:item.details).map(d=>`<li>${d}</li>`).join('')}</ul></div>` : ''}
      ${editMode ? editButtons(sectionId, item) : ''}
    `;
  } else if (sectionId === 'research') {
    bodyHTML = `
      <div class="modal-title">${field(item, 'name')}</div>
      <div class="modal-sub">${field(item, 'institution')}</div>
      <div class="modal-meta"><span>📅 ${item.start} — ${field(item, 'end')}</span></div>
      ${item.details ? `<div class="modal-section"><h4>${t('研究内容', 'Research Details')}</h4><ul class="modal-detail-list">${(currentLang==='en'&&item.details_en?item.details_en:item.details).map(d=>`<li>${d}</li>`).join('')}</ul></div>` : ''}
      ${editMode ? editButtons(sectionId, item) : ''}
    `;
  } else if (sectionId === 'publications') {
    bodyHTML = `
      <div class="modal-title">${field(item, 'title')}</div>
      <div class="modal-sub">${field(item, 'authors')}</div>
      <div class="modal-meta"><span>📰 ${field(item, 'venue')}</span><span>📅 ${item.year}</span>${item.doi?`<span>🔗 <a href="https://doi.org/${item.doi}" target="_blank" style="color:var(--blue-600)">DOI</a></span>`:''}</div>

    `;
  } else if (sectionId === 'awards') {
    bodyHTML = `
      <div class="modal-title">${field(item, 'title')}</div>
      <div class="modal-sub">${field(item, 'issuer')}</div>
      <div class="modal-meta"><span>📅 ${item.year}</span></div>
      ${item.summary?`<p style="font-size:14px;color:var(--gray-700);line-height:1.7">${field(item,'summary')}</p>`:''}

  document.getElementById('modalBody').innerHTML = bodyHTML;

function editButtons(sectionId, item) {
  return `
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--gray-200);display:flex;gap:8px">
      <button onclick="event.stopPropagation();editItem('${sectionId}','${item.id}')" style="padding:6px 14px;border:1px solid var(--blue-200);background:white;border-radius:6px;cursor:pointer;font-size:12px;color:var(--blue-700)">✏️ 编辑</button>
      <button onclick="event.stopPropagation();deleteItem('${sectionId}','${item.id}')" style="padding:6px 14px;border:1px solid #ffcdd2;background:white;border-radius:6px;cursor:pointer;font-size:12px;color:#c62828">🗑 删除</button>
    </div>
  `;
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

// ===== 语言切换 =====
function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  const btn = document.getElementById('btnLang');
  btn.textContent = currentLang === 'zh' ? '🌐 English' : '🌐 中文';
  renderAll();
}

// ===== 编辑模式 =====
function toggleEdit() {
  editMode = !editMode;
  const btn = document.getElementById('btnEdit');
  const panel = document.getElementById('editPanel');
  if (editMode) {
    btn.textContent = '✏️ 退出编辑';
    btn.classList.add('active');
    panel.classList.add('show');
    document.getElementById('editHint').textContent =
      '编辑模式下，点击任意卡片可在弹窗中看到"编辑"和"删除"按钮。修改会自动保存到浏览器本地。\n\n导出 JSON 可以将当前数据下载为文件，替换原来的 data.json。';
  } else {
    btn.textContent = '✏️ 编辑模式';
    btn.classList.remove('active');
    panel.classList.remove('show');
  }
}

function deleteItem(sectionId, itemId) {
  if (!confirm(t('确定要删除这条记录吗？', 'Are you sure you want to delete this item?'))) return;
  const key = sectionId;
  resumeData[key] = resumeData[key].filter(i => i.id !== itemId);
  saveToLocal();
  closeModal();
  renderAll();
}

function editItem(sectionId, itemId) {
  const items = resumeData[sectionId];
  const item = items.find(i => i.id === itemId);
  if (!item) return;
  const newData = prompt(t('请粘贴JSON数据来更新此条目（可从导出的文件中复制）：', 'Paste JSON data to update this item:'), JSON.stringify(item, null, 2));
  if (!newData) return;
  try {
    const parsed = JSON.parse(newData);
    const idx = items.findIndex(i => i.id === itemId);
    items[idx] = parsed;
    saveToLocal();
    closeModal();
    renderAll();
  } catch(e) {
    alert(t('JSON格式错误，请检查。', 'Invalid JSON format. Please check.'));
  }
}

function addItemDialog() {
  const section = prompt(t(
    '请输入要添加到的板块（education / experience / projects / publications / awards / skills）：',
    'Enter section name (education / experience / projects / publications / awards / skills):'
  ));
  if (!section || !resumeData[section]) return;
  const jsonStr = prompt(t('请粘贴新条目的JSON数据：', 'Paste JSON data for the new item:'));
  if (!jsonStr) return;
  try {
    const parsed = JSON.parse(jsonStr);
    if (!parsed.id) parsed.id = section + '-' + Date.now();
    if (section === 'skills') {
      resumeData.skills.push(parsed);
    } else {
      resumeData[section].push(parsed);
    }
    saveToLocal();
    renderAll();
    alert(t('添加成功！', 'Added successfully!'));
  } catch(e) {
    alert(t('JSON格式错误，请检查。', 'Invalid JSON format. Please check.'));
  }
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(resumeData, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        resumeData = JSON.parse(ev.target.result);
        saveToLocal();
        renderAll();
        alert(t('导入成功！', 'Imported successfully!'));
      } catch(ex) {
        alert(t('JSON格式错误。', 'Invalid JSON format.'));
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData() {
  if (!confirm(t('恢复默认数据将覆盖当前编辑内容，确定吗？', 'Reset to default data? Current changes will be lost.'))) return;
  localStorage.removeItem('resumeData');
  location.reload();
}

function clearLocalData() {
  if (!confirm(t('清除所有本地编辑数据，页面将恢复为 data.json 的原始内容。确定吗？', 'Clear all local edits? Page will revert to original data.json content.'))) return;
  localStorage.removeItem('resumeData');
  location.reload();
}

// ===== 滚动监听 =====
function setupScrollSpy() {
  const sections = document.querySelectorAll('.section');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) updateActiveNav(entry.target.id);
    });
  }, { rootMargin: '-20% 0px -70% 0px' });

  sections.forEach(s => observer.observe(s));
}

// ===== 键盘关闭弹窗 =====
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ===== 启动 =====
loadData();
</script>
